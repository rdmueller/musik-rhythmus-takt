# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Notenwerte im Takt
description: "Notenwerte und Pausen zusammenzählen: Passt das in den Takt? Was fehlt noch? Wo kommt der Taktstrich hin?"
competencies: [notenwerte-im-takt]
blocks:
  - type: section
    id: einstieg
    title: Ist der Takt voll?
    blocks:
      - type: text
        text: >-
          Auf dieser Seite lernst du, Notenwerte und Pausen in einem Takt zusammenzuzählen. Du kennst die Notenwerte,
          Pausen und Punkte, und du weißt vom Klopfen, dass ein 4/4-Takt vier Schläge hat. Schau dir diesen Takt an:
      - type: vue-component
        component: NotenZeile
        props:
          zeichen:
            - { wert: 2, pause: false, punkt: false, triole: false }
            - { wert: 4, pause: false, punkt: false, triole: false }
            - { wert: 4, pause: true, punkt: false, triole: false }
          oben: 4
          unten: 4
          taktstriche: [2]
          luecke: false
          klickbar: false
          beschreibung: "Ein 4/4-Takt: halbe Note, Viertelnote, Viertelpause, dann ein Taktstrich."
        nojs: "Ein 4/4-Takt: halbe Note, Viertelnote, Viertelpause, dann ein Taktstrich."
      - type: single-choice
        id: einstieg-voll
        text: Der Takt hat vier Viertel Platz. Ist er voll?
        options:
          - text: Ja, genau vier Viertel
            correct: true
            info: "Halbe Note (2 Viertel) + Viertelnote (1) + Viertelpause (1) = 4 Viertel."
          - text: Nein, eine Viertel fehlt
            correct: false
            info: Die Pause zählt mit. Auch Stille füllt den Takt.
          - text: Nein, er ist zu voll
            correct: false
            info: "Zusammen sind es genau 4 Viertel: 2 + 1 + 1."
        explanation: Noten und Pausen zusammen müssen den Takt genau füllen.
        links:
          - title: Takt (Wikipedia)
            url: "https://de.wikipedia.org/wiki/Takt_(Musik)"
  - type: section
    id: regel
    title: Die Taktangabe zählt mit
    blocks:
      - type: text
        text: >-
          Am Anfang steht die **Taktangabe**, zwei Zahlen übereinander. Die obere sagt, wie viele Schläge ein Takt hat,
          die untere, welcher Notenwert einen Schlag dauert. 3/4 heißt also: drei Viertel pro Takt. Der **Taktstrich**
          beendet einen Takt. Alles zwischen zwei Taktstrichen, Noten, Pausen und Punkte, muss zusammen genau so lang sein.
      - type: vue-component
        component: NotenZeile
        props:
          zeichen:
            - { wert: 2, pause: false, punkt: false, triole: false }
            - { wert: 4, pause: false, punkt: false, triole: false }
            - { wert: 4, pause: false, punkt: true, triole: false }
            - { wert: 8, pause: false, punkt: false, triole: false }
            - { wert: 4, pause: true, punkt: false, triole: false }
            - { wert: 2, pause: false, punkt: true, triole: false }
          oben: 3
          unten: 4
          taktstriche: [1, 4]
          luecke: false
          klickbar: false
          beschreibung: "Drei Takte im 3/4-Takt: halbe und Viertel; punktierte Viertel, Achtel und Viertelpause; eine punktierte halbe Note."
        nojs: >-
          Drei Takte im 3/4-Takt, durch Taktstriche getrennt: halbe Note und Viertelnote; punktierte Viertelnote,
          Achtelnote und Viertelpause; eine punktierte halbe Note. Jeder Takt dauert drei Viertel.
      - type: table
        caption: So viel passt in einen Takt
        header: [Taktart, in Vierteln und Achteln]
        rows:
          - [2/4-Takt, "2 Viertel = 4 Achtel"]
          - [3/4-Takt, "3 Viertel = 6 Achtel"]
          - [4/4-Takt, "4 Viertel = 8 Achtel"]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: >-
              Zähl Pausen und Punkte mit. Am leichtesten rechnest du alles in Achteln: Viertel 2, punktierte Viertel 3,
              halbe 4, punktierte halbe 6.
      - type: definition
        term: Taktangabe
        explanation: Die zwei Zahlen am Anfang; oben die Zahl der Schläge pro Takt, unten der Notenwert eines Schlags.
      - type: definition
        term: Taktart
        explanation: Wie ein Takt aufgebaut ist, benannt nach der Taktangabe, zum Beispiel 3/4-Takt.
  - type: section
    id: beispiel
    title: "Beispiel: was fehlt im 3/4-Takt?"
    blocks:
      - type: example
        title: "Im 3/4-Takt stehen eine punktierte Viertelnote und eine Achtelnote. Was fehlt?"
        blocks:
          - type: text
            text: |
              1. Ein 3/4-Takt hat 6 Achtel Platz.
              2. Punktierte Viertel = 3 Achtel, Achtel = 1 Achtel. Zusammen 4 Achtel.
              3. Es fehlen 6 − 4 = 2 Achtel, also eine **Viertelnote** oder eine Viertelpause.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: number
        id: achtel-im-dreiviertel
        text: Wie viele Achtelnoten passen in einen 3/4-Takt?
        answer: 6
        tolerance: 0
        mistakes:
          - answer: 3
            message: Drei sind es in Vierteln. Jede Viertel sind zwei Achtel.
          - answer: 4
            message: "Die untere Zahl sagt den Notenwert eines Schlags, nicht die Zahl der Achtel: drei Viertel."
        explanation: "3/4 heißt drei Viertel, und drei Viertel sind sechs Achtel."
        links:
          - title: Takt (Wikipedia)
            url: "https://de.wikipedia.org/wiki/Takt_(Musik)"
      - type: vue-component
        id: takt-ergaenzen
        component: TaktErgaenzen
        props:
          aufgabe: Was fehlt noch in diesem Takt? Wähle den Notenwert für die Lücke.
          takte: ["2/4", "3/4", "4/4"]
          punkt: true
          triole: false
          beschriftung: &takt
            wert: Notenwert
            art: Note oder Pause
            note: Note
            pause: Pause
            punkt: Punkt
            ohnePunkt: ohne Punkt
            mitPunkt: punktiert
          mistakes:
            - "Das ist zu viel, der Takt wird übervoll. Rechne alles in Achteln und zieh es von der Taktlänge ab."
            - "Das ist zu wenig, der Takt ist noch nicht voll. Rechne alles in Achteln."
            - Hast du den Punkt im Takt mitgerechnet? Er verlängert um die Hälfte.
            - Die Triole dauert so lange wie zwei Achtel, nicht wie drei.
        examples:
          accepted:
            - { answer: { wert: 16, punkt: false, pause: false }, seed: 1 }
            - { answer: { wert: 16, punkt: false, pause: true }, seed: 1 }
          rejected:
            - { answer: { wert: 8, punkt: false, pause: false }, seed: 1 }
      - type: vue-component
        id: taktstriche-setzen
        component: TaktstricheSetzen
        props:
          aufgabe: Setze die Taktstriche. Tippe auf „nach Zeichen …“, wo ein Takt voll ist. Den Strich am Ende brauchst du nicht.
          takte: ["2/4", "3/4", "4/4"]
          anzahl: 3
          punkt: true
          triole: false
          lueckenname: "nach Zeichen {n}"
          mistakes:
            - Ein Taktstrich steht zu früh, der Takt davor ist noch nicht voll.
            - Ein Taktstrich steht zu spät, der Takt davor ist übervoll.
            - Ein Taktstrich fehlt. Die Zeile hat drei Takte.
            - Da ist ein Taktstrich zu viel.
        examples:
          accepted:
            - { answer: [2, 5], seed: 1 }
            - { answer: [5, 2], seed: 1 }
          rejected:
            - { answer: [1, 5], seed: 1 }
            - { answer: [5], seed: 1 }
      - type: true-false
        id: zweiviertel-passt
        text: In einen 2/4-Takt passen genau eine Viertelnote und zwei Achtelnoten.
        answer: true
        explanation: "Eine Viertel (2 Achtel) + zwei Achtel = 4 Achtel, so viel wie zwei Viertel."
        links:
          - title: Takt (Wikipedia)
            url: "https://de.wikipedia.org/wiki/Takt_(Musik)"
      - type: text
        text: >-
          Jetzt füllst und gliederst du Takte. Als Nächstes lernst du eine Taktart, deren untere Zahl eine 8 ist: den
          6/8-Takt.
